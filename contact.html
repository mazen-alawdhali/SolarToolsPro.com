<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contactTabTitle">اتصل بنا | أدوات الطاقة الشمسية الاحترافية</title>

    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Solar Tools">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0f172a">

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #ffffff; margin: 0; padding: 0; line-height: 1.8; position: relative; }
        .container { max-width: 650px; margin: 30px auto; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; }
        
        .lang-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: 0.2s;
            z-index: 10;
        }
        [dir="ltr"] .lang-btn { left: auto; right: 20px; }
        .lang-btn:hover { background: rgba(255, 255, 255, 0.25); }

        .header-title-box {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(16, 185, 129, 0.35);
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }

        h1 { color: #10b981; font-size: 20px; margin: 0; font-weight: 800; }
        p { color: #ffffff; font-size: 14px; }
        
        .contact-methods { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .row-top { display: flex; gap: 12px; width: 100%; }
        .c-btn { flex: 1; padding: 12px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: bold; color: #fff; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .wa { background: #059669; }
        .fb { background: #1877F2; }
        .email { background: #0284c7; width: 100%; }

        form { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; color: #10b981; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #10b981; outline: none; }
        button { background: #0284c7; color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .back-btn { display: inline-block; margin-bottom: 20px; background: #334155; color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { background: #0284c7; }
    </style>
</head>
<body>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
    <div class="container">
        <a href="index.html" class="back-btn" data-i18n="backBtn">➔ العودة للرئيسية</a>
        
        <div class="header-title-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <h1 data-i18n="contactHeading">تواصل معنا</h1>
        </div>

        <p data-i18n="contactIntro">يسعدنا تواصلكم معنا واستقبال استفساراتكم واقتراحاتكم لتطوير منصة أدوات الطاقة الشمسية الاحترافية:</p>

        <div class="contact-methods">
            <div class="row-top">
                <a href="https://wa.me/message/BSOAV5RVXBNQP1" target="_blank" class="c-btn wa" data-i18n="waBtn">💬 واتساب مباشر</a>
                <a href="https://www.facebook.com/share/1YF9n8KTFK/" target="_blank" class="c-btn fb" data-i18n="fbBtn">🌐 فيسبوك</a>
            </div>
            <a href="mailto:mazenalawdhali@gmail.com" class="c-btn email" data-i18n="emailBtn">✉️ البريد الإلكتروني</a>
        </div>

        <form onsubmit="return false;">
            <label data-i18n="formLabel">إرسال مقترح أو ملاحظة مباشرة:</label>
            <input type="text" id="senderName" placeholder="اسمك (اختياري)">
            <textarea id="feedbackMsg" rows="5" placeholder="اكتب مقترحك أو الشكوى هنا..." required></textarea>
            
            <button type="button" onclick="sendToEmail()" style="width: 100%; background: #0284c7;" data-i18n="sendBtn">إرسال عبر البريد الإلكتروني</button>
        </form>
    </div>

    <script>
        const dict = {
            ar: {
                contactTabTitle: "اتصل بنا | أدوات الطاقة الشمسية الاحترافية",
                backBtn: "➔ العودة للرئيسية",
                contactHeading: "تواصل معنا",
                contactIntro: "يسعدنا تواصلكم معنا واستقبال استفساراتكم واقتراحاتكم لتطوير منصة أدوات الطاقة الشمسية الاحترافية:",
                waBtn: "💬 واتساب مباشر",
                fbBtn: "🌐 فيسبوك",
                emailBtn: "✉️ البريد الإلكتروني",
                formLabel: "إرسال مقترح أو ملاحظة مباشرة:",
                namePh: "اسمك (اختياري)",
                msgPh: "اكتب مقترحك أو الشكوى هنا...",
                sendBtn: "إرسال عبر البريد الإلكتروني",
                alertEmpty: "يرجى كتابة نص الرسالة أولاً",
                emailSubject: "مقترح/ملاحظة من"
            },
            en: {
                contactTabTitle: "Contact Us | Solar Tools Pro",
                backBtn: "➔ Back to Home",
                contactHeading: "Contact Us",
                contactIntro: "We welcome your inquiries and suggestions to improve the Solar Tools Pro platform:",
                waBtn: "💬 Direct WhatsApp",
                fbBtn: "🌐 Facebook",
                emailBtn: "✉️ Direct Email",
                formLabel: "Send Feedback or Note Directly:",
                namePh: "Your Name (Optional)",
                msgPh: "Type your feedback or suggestion here...",
                sendBtn: "Send via Email",
                alertEmpty: "Please enter your message first",
                emailSubject: "Feedback/Note from"
            }
        };

        let currentLang = localStorage.getItem('solar_app_lang') || localStorage.getItem('stp_main_lang') || 'ar';

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('solar_app_lang', currentLang);
            localStorage.setItem('stp_main_lang', currentLang);
            applyLang();
        }

        function applyLang() {
            const t = dict[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
            document.title = t.contactTabTitle;

            document.getElementById('senderName').placeholder = t.namePh;
            document.getElementById('feedbackMsg').placeholder = t.msgPh;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerHTML = t[key];
            });
        }

        function sendToEmail() {
            const t = dict[currentLang];
            const name = document.getElementById('senderName').value || (currentLang === 'ar' ? 'زائر' : 'Visitor');
            const msg = document.getElementById('feedbackMsg').value;
            if(!msg) { alert(t.alertEmpty); return; }
            const subject = encodeURIComponent(`${t.emailSubject} ${name} - Solar Tools Pro`);
            const body = encodeURIComponent(msg);
            window.location.href = `mailto:mazenalawdhali@gmail.com?subject=${subject}&body=${body}`;
        }

        applyLang();
    </script>
</body>
</html>
